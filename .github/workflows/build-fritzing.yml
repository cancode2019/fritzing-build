name: Build Fritzing Windows EXE

on:
  workflow_dispatch:
    inputs:
      fritzing_branch:
        description: "Fritzing dalı veya sürüm etiketi (örn: develop, 1.0.4)"
        required: true
        default: "develop"

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: 1. Qt 6 Kurulumu
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          arch: "win64_msvc2019_64"
          modules: "qt5compat qtserialport"

      - name: 1b. jom Kurulumu
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -L -f -o C:\jom.zip "https://download.qt.io/official_releases/jom/jom.zip"
          Expand-Archive -Path C:\jom.zip -DestinationPath C:\jom -Force
          "C:\jom" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 2. MSVC (Visual Studio 2022) Ortamını Yükle
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 3. Kaynak Kodları ve Bağımlılıkları İndir
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path C:\fbuild | Out-Null
          Set-Location C:\fbuild

          # Fritzing ana uygulama ve parça kütüphanesi
          git clone --depth 1 --branch "${{ inputs.fritzing_branch }}" https://github.com/fritzing/fritzing-app.git
          git clone --depth 1 https://github.com/fritzing/fritzing-parts.git

          # Yardımcı kütüphaneler
          git clone --depth 1 https://github.com/svgpp/svgpp.git
          git clone --depth 1 --branch v1.7.2 https://github.com/libgit2/libgit2.git
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git
          git clone --depth 1 --branch v1.4 https://github.com/stachenov/quazip.git

          # Clipper1 (SourceForge resmi paketi)
          curl.exe -L -f -A "Wget/1.21" -o clipper.zip "https://sourceforge.net/projects/polyclipping/files/clipper_ver6.4.2.zip/download"
          7z x clipper.zip -oC:\fbuild\Clipper1 -y | Out-Null
          Remove-Item clipper.zip

          # Boost (yalnızca header dosyaları yeterli)
          curl.exe -L -f -o boost.zip "https://archives.boost.io/release/1.85.0/source/boost_1_85_0.zip"
          7z x boost.zip -oC:\fbuild -y | Out-Null
          Remove-Item boost.zip

          # ngspice (Windows 64-bit DLL paketi)
          curl.exe -L -f -A "Wget/1.21" -o ngspice.7z "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/old-releases/42/ngspice-42_dll_64.7z/download"
          7z x ngspice.7z -oC:\fbuild\ngspice-42 -y | Out-Null
          Remove-Item ngspice.7z

      - name: 4. Alt Kütüphaneleri Derle (libgit2, Clipper1, zlib, QuaZip)
        shell: cmd
        run: |
          REM --- libgit2 ---
          cd /d C:\fbuild\libgit2
          cmake -B build64 -G "NMake Makefiles" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_SHARED_LIBS=ON || exit /b 1
          cmake --build build64 || exit /b 1
          mkdir C:\fbuild\libgit2\build64\Release 2>nul
          copy /Y C:\fbuild\libgit2\build64\git2.* C:\fbuild\libgit2\build64\Release\ || exit /b 1

          REM --- Clipper1 (MSVC'de .lib üretmesi için statik derlenir) ---
          cd /d C:\fbuild\Clipper1\cpp
          cmake -B build -G "NMake Makefiles" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=C:\fbuild\Clipper1\6.4.2 || exit /b 1
          cmake --build build || exit /b 1
          cmake --install build || exit /b 1

          REM --- zlib ---
          cd /d C:\fbuild\zlib
          cmake -B build -G "NMake Makefiles" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=C:\fbuild\zlib_install || exit /b 1
          cmake --build build || exit /b 1
          cmake --install build || exit /b 1

          REM --- QuaZip ---
          cd /d C:\fbuild\quazip
          cmake -B build -G "NMake Makefiles" ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DQUAZIP_QT_MAJOR_VERSION=6 ^
            -DQUAZIP_FETCH_LIBS=OFF ^
            -DQUAZIP_ENABLE_TESTS=OFF ^
            -DBUILD_SHARED_LIBS=ON ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%;C:\fbuild\zlib_install" ^
            -DZLIB_ROOT=C:\fbuild\zlib_install ^
            -DZLIB_INCLUDE_DIR=C:\fbuild\zlib_install\include ^
            -DZLIB_LIBRARY=C:\fbuild\zlib_install\lib\zlib.lib ^
            -DCMAKE_INSTALL_PREFIX=C:\fbuild\quazip_qt6.5.3 || exit /b 1
          cmake --build build || exit /b 1
          cmake --install build || exit /b 1
          if not exist C:\fbuild\quazip_qt6_6.5.3 mklink /J C:\fbuild\quazip_qt6_6.5.3 C:\fbuild\quazip_qt6.5.3

      - name: 5. Fritzing Derlemesi (qmake + jom)
        shell: cmd
        run: |
          if not exist C:\fbuild\libgit2\lib mkdir C:\fbuild\libgit2\lib
          copy /Y C:\fbuild\libgit2\build64\git2.* C:\fbuild\libgit2\lib\ || exit /b 1
          if not exist C:\fbuild\libgit2-1.7.1 mklink /J C:\fbuild\libgit2-1.7.1 C:\fbuild\libgit2
          if exist C:\fbuild\ngspice-42\Spice64_dll\include if not exist C:\fbuild\ngspice-42\include mklink /J C:\fbuild\ngspice-42\include C:\fbuild\ngspice-42\Spice64_dll\include
          if not exist C:\fbuild\quazip-6.5.3-1.4intuisphere mklink /J C:\fbuild\quazip-6.5.3-1.4intuisphere C:\fbuild\quazip_qt6.5.3
          if not exist C:\fbuild\svgpp-1.3.1 mklink /J C:\fbuild\svgpp-1.3.1 C:\fbuild\svgpp
          set "INCLUDE=C:\fbuild\zlib_install\include;C:\fbuild\Clipper1\6.4.2\include\polyclipping;%INCLUDE%"
          set "LIB=C:\fbuild\zlib_install\lib;C:\fbuild\Clipper1\6.4.2\lib;%LIB%"
          cd /d C:\fbuild\fritzing-app
          qmake phoenix.pro "CONFIG+=release" || exit /b 1
          jom -j%NUMBER_OF_PROCESSORS% release || exit /b 1

      - name: 6. Taşınabilir (Portable) Klasörü Hazırla
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "C:\fbuild\dist\Fritzing"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Ana EXE dosyasını bul
          $exe = Get-ChildItem -Path C:\fbuild -Filter "Fritzing.exe" -Recurse |
                 Where-Object { $_.FullName -notlike "$dist*" } |
                 Select-Object -First 1
          if (-not $exe) { throw "Fritzing.exe bulunamadi!" }
          Write-Host "Bulunan EXE: $($exe.FullName)"
          Copy-Item $exe.FullName -Destination $dist -Force

          # Alt kütüphane DLL'lerini topla
          Get-ChildItem -Path C:\fbuild\libgit2\build64 -Filter "*.dll" -Recurse | Copy-Item -Destination $dist -Force
          Get-ChildItem -Path C:\fbuild\quazip_qt6.5.3 -Filter "*.dll" -Recurse | Copy-Item -Destination $dist -Force
          Get-ChildItem -Path C:\fbuild\zlib_install\bin -Filter "*.dll" -Recurse | Copy-Item -Destination $dist -Force
          Get-ChildItem -Path C:\fbuild\ngspice-42 -Filter "ngspice.dll" -Recurse | Copy-Item -Destination $dist -Force

          # Parça kütüphanesi (.git klasörünü atlayarak boyutu küçült)
          robocopy "C:\fbuild\fritzing-parts" "$dist\fritzing-parts" /E /XD .git | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "fritzing-parts kopyalanamadi!" }
          $global:LASTEXITCODE = 0

          # Qt bağımlılıklarını otomatik topla
          windeployqt --release --no-translations "$dist\Fritzing.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt basarisiz oldu!" }

          # Parça veritabanını önceden oluştur
          $env:QT_QPA_PLATFORM = "offscreen"
          Push-Location $dist
          try {
            & "$dist\Fritzing.exe" -db "$dist\fritzing-parts\parts.db" -pp "$dist\fritzing-parts" -f "$dist"
          } catch {
            Write-Warning "parts.db onceden olusturulamadi, Fritzing ilk acilista otomatik olusturacak."
          } finally {
            Pop-Location
          }

          # Portable ZIP oluştur
          Compress-Archive -Path "$dist\*" -DestinationPath "C:\fbuild\Fritzing-Portable.zip" -Force

      - name: 7. Inno Setup ile Tek Dosya Kurulum (.exe) Oluştur
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iss = @"
          [Setup]
          AppName=Fritzing
          AppVersion=1.0
          DefaultDirName={autopf}\Fritzing
          DefaultGroupName=Fritzing
          OutputDir=C:\fbuild
          OutputBaseFilename=Fritzing-Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: "C:\fbuild\dist\Fritzing\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Fritzing"; Filename: "{app}\Fritzing.exe"
          Name: "{autodesktop}\Fritzing"; Filename: "{app}\Fritzing.exe"
          "@
          Set-Content -Path "C:\fbuild\setup.iss" -Value $iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "C:\fbuild\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi basarisiz oldu!" }

      - name: 8. Çıktıları İndirilebilir Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-Windows-x64
          path: |
            C:\fbuild\Fritzing-Setup.exe
            C:\fbuild\Fritzing-Portable.zip
